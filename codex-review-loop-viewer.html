<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Review Loop Bug Viewer</title>
    <style>
      :root {
        --bg: #f3efe6;
        --panel: rgba(255, 252, 245, 0.88);
        --panel-strong: #fffaf0;
        --text: #182028;
        --muted: #596675;
        --line: rgba(24, 32, 40, 0.12);
        --accent: #0d8f78;
        --accent-strong: #0a6d5c;
        --accent-soft: rgba(13, 143, 120, 0.12);
        --critical: #b42318;
        --critical-soft: rgba(180, 35, 24, 0.12);
        --high: #dd6b20;
        --high-soft: rgba(221, 107, 32, 0.12);
        --medium: #2563eb;
        --medium-soft: rgba(37, 99, 235, 0.12);
        --low: #4f46e5;
        --low-soft: rgba(79, 70, 229, 0.12);
        --success: #047857;
        --warning: #b45309;
        --shadow: 0 18px 60px rgba(45, 40, 26, 0.12);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(13, 143, 120, 0.14), transparent 28%),
          radial-gradient(circle at top right, rgba(221, 107, 32, 0.14), transparent 28%),
          linear-gradient(180deg, #f8f3ea 0%, #efe7d8 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(24, 32, 40, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(24, 32, 40, 0.03) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.8), transparent);
      }

      .page {
        width: min(1400px, calc(100vw - 40px));
        margin: 32px auto 56px;
        position: relative;
        z-index: 1;
      }

      .hero {
        padding: 36px;
        border-radius: var(--radius-xl);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 248, 237, 0.82)),
          linear-gradient(135deg, rgba(13, 143, 120, 0.12), rgba(221, 107, 32, 0.08));
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.9);
      }

      .hero-top {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .title-block {
        max-width: 700px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(24, 32, 40, 0.06);
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(36px, 4vw, 56px);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .upload-panel {
        width: min(100%, 460px);
        padding: 20px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(24, 32, 40, 0.08);
      }

      .dropzone {
        display: block;
        width: 100%;
        padding: 22px;
        border: 1.5px dashed rgba(13, 143, 120, 0.35);
        border-radius: var(--radius-md);
        background: linear-gradient(180deg, rgba(13, 143, 120, 0.06), rgba(13, 143, 120, 0.02));
        transition: 180ms ease;
        cursor: pointer;
      }

      .dropzone:hover,
      .dropzone.dragover {
        transform: translateY(-1px);
        border-color: rgba(13, 143, 120, 0.7);
        background: linear-gradient(180deg, rgba(13, 143, 120, 0.12), rgba(13, 143, 120, 0.04));
      }

      .dropzone strong {
        display: block;
        font-size: 16px;
        margin-bottom: 8px;
      }

      .dropzone span {
        display: block;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .hidden-input {
        display: none;
      }

      .upload-actions {
        margin-top: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 180ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-button {
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        box-shadow: 0 10px 24px rgba(13, 143, 120, 0.24);
      }

      .secondary-button {
        color: var(--text);
        background: rgba(24, 32, 40, 0.06);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
        box-shadow: none;
      }

      .file-meta,
      .status-text {
        font-size: 13px;
        color: var(--muted);
      }

      .status-text.error {
        color: var(--critical);
      }

      .status-text.success {
        color: var(--success);
      }

      .content {
        margin-top: 28px;
        display: grid;
        gap: 22px;
      }

      .panel {
        border-radius: var(--radius-lg);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .panel-header {
        padding: 22px 24px 0;
      }

      .panel-title {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.03em;
      }

      .panel-subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .stats-grid {
        padding: 18px 24px 24px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
      }

      .stat-card {
        padding: 18px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(24, 32, 40, 0.06);
      }

      .stat-label {
        color: var(--muted);
        font-size: 13px;
      }

      .stat-value {
        margin-top: 10px;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.05em;
      }

      .session-layout {
        display: grid;
        grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
        gap: 0;
      }

      .session-sidebar {
        border-right: 1px solid var(--line);
        padding: 20px;
        background: rgba(255, 255, 255, 0.36);
      }

      .session-list {
        display: grid;
        gap: 12px;
      }

      .session-card {
        width: 100%;
        text-align: left;
        padding: 16px;
        border-radius: var(--radius-md);
        background: white;
        border: 1px solid rgba(24, 32, 40, 0.08);
      }

      .session-card.active {
        border-color: rgba(13, 143, 120, 0.45);
        background: linear-gradient(180deg, rgba(13, 143, 120, 0.09), rgba(255, 255, 255, 0.92));
      }

      .session-card h3 {
        margin: 0 0 10px;
        font-size: 16px;
        letter-spacing: -0.02em;
      }

      .session-card p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .session-main {
        padding: 24px;
      }

      .session-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        background: rgba(24, 32, 40, 0.06);
      }

      .pill.completed {
        color: var(--success);
        background: rgba(4, 120, 87, 0.12);
      }

      .pill.failed {
        color: var(--critical);
        background: rgba(180, 35, 24, 0.12);
      }

      .pill.warning {
        color: var(--warning);
        background: rgba(180, 83, 9, 0.12);
      }

      .session-detail-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .detail-card {
        padding: 16px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(24, 32, 40, 0.08);
        background: rgba(255, 255, 255, 0.8);
      }

      .detail-card strong {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      .detail-card span {
        display: block;
        font-size: 15px;
        line-height: 1.5;
        word-break: break-word;
      }

      .severity-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .severity-chip {
        border-radius: 999px;
        padding: 10px 14px;
        background: rgba(24, 32, 40, 0.06);
        color: var(--text);
      }

      .severity-chip.active {
        background: rgba(24, 32, 40, 0.12);
      }

      .severity-chip.critical {
        background: var(--critical-soft);
        color: var(--critical);
      }

      .severity-chip.high {
        background: var(--high-soft);
        color: var(--high);
      }

      .severity-chip.medium {
        background: var(--medium-soft);
        color: var(--medium);
      }

      .severity-chip.low {
        background: var(--low-soft);
        color: var(--low);
      }

      .issue-list,
      .run-list {
        display: grid;
        gap: 16px;
      }

      .issue-card {
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid rgba(24, 32, 40, 0.08);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 250, 244, 0.92));
        box-shadow: 0 12px 24px rgba(24, 32, 40, 0.05);
      }

      .issue-card.critical {
        border-left: 6px solid var(--critical);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(180, 35, 24, 0.05));
      }

      .issue-card.high {
        border-left: 6px solid var(--high);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(221, 107, 32, 0.05));
      }

      .issue-card.medium {
        border-left: 6px solid var(--medium);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(37, 99, 235, 0.05));
      }

      .issue-card.low {
        border-left: 6px solid var(--low);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(79, 70, 229, 0.05));
      }

      .issue-top {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .issue-title {
        margin: 0;
        font-size: 19px;
        line-height: 1.4;
        letter-spacing: -0.02em;
      }

      .issue-badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(24, 32, 40, 0.08);
      }

      .issue-path {
        margin: 12px 0 0;
        font-size: 13px;
        color: var(--muted);
        word-break: break-all;
      }

      .issue-summary-list {
        margin-top: 14px;
        display: grid;
        gap: 8px;
      }

      .issue-line {
        display: grid;
        grid-template-columns: 28px 64px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(24, 32, 40, 0.06);
      }

      .issue-line.done {
        background: rgba(4, 120, 87, 0.08);
        border-color: rgba(4, 120, 87, 0.16);
      }

      .issue-checkbox {
        width: 18px;
        height: 18px;
        margin-top: 6px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .issue-line-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--accent-strong);
        background: rgba(13, 143, 120, 0.12);
      }

      .issue-line-value {
        min-width: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        padding-top: 3px;
      }

      .issue-line.done .issue-line-value {
        color: var(--muted);
        text-decoration: line-through;
      }

      .issue-line-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        margin-top: 1px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--warning);
        background: rgba(180, 83, 9, 0.12);
        white-space: nowrap;
      }

      .issue-line-status.done {
        color: var(--success);
        background: rgba(4, 120, 87, 0.14);
      }

      .run-card {
        padding: 18px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(24, 32, 40, 0.08);
        background: white;
      }

      .run-top {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        flex-wrap: wrap;
        align-items: center;
      }

      .run-top h3 {
        margin: 0;
        font-size: 16px;
      }

      .run-card p,
      .run-card li,
      .run-card summary {
        font-size: 14px;
        line-height: 1.7;
      }

      .run-card p {
        margin: 12px 0 0;
        color: var(--text);
        white-space: pre-wrap;
      }

      .run-card ul {
        margin: 12px 0 0;
        padding-left: 18px;
        color: var(--muted);
      }

      details {
        margin-top: 12px;
      }

      summary {
        cursor: pointer;
        color: var(--accent-strong);
        font-weight: 700;
      }

      .empty-state {
        padding: 60px 24px;
        text-align: center;
        color: var(--muted);
      }

      .error-box {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background: rgba(180, 35, 24, 0.08);
        color: var(--critical);
        font-size: 14px;
        line-height: 1.6;
      }

      @media (max-width: 980px) {
        .session-layout {
          grid-template-columns: 1fr;
        }

        .session-sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }

      @media (max-width: 640px) {
        .page {
          width: min(100vw - 20px, 1400px);
          margin: 16px auto 28px;
        }

        .hero,
        .session-main,
        .session-sidebar,
        .panel-header,
        .stats-grid {
          padding-left: 16px;
          padding-right: 16px;
        }

        h1 {
          line-height: 1;
        }

        .issue-line {
          grid-template-columns: 28px 64px minmax(0, 1fr);
        }

        .issue-line-status {
          grid-column: 2 / span 2;
          width: fit-content;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-top">
          <div class="title-block">
            <div class="eyebrow">Codex Review Loop Report</div>
            <h1>把 Review JSON 变成可读的 Bug 看板</h1>
            <p>
              上传 `codex-review-loop-report.json` 后，页面会按 session、run、issue
              三个层次渲染，方便你快速定位严重问题、查看出现轮次和对应文件位置。
            </p>
          </div>

          <section class="upload-panel" aria-label="上传 JSON">
            <label class="dropzone" id="dropzone" for="report-file">
              <strong>选择或拖入报告 JSON</strong>
              <span>
                仅接受 `tool = codex-review-loop` 且包含 `sessions` 数组的报告文件。
              </span>
              <span id="selected-file" class="file-meta">当前未选择文件</span>
            </label>

            <input
              id="report-file"
              class="hidden-input"
              type="file"
              accept="application/json,.json"
            />

            <div class="upload-actions">
              <button id="render-button" class="primary-button" disabled>
                上传并渲染
              </button>
              <button id="reset-button" class="secondary-button" type="button">
                清空
              </button>
              <span id="status-text" class="status-text">
                可直接上传
                `/Users/lizhibo/work/code/youtube-dubbing/youtube-dubbing-extension/codex-review-loop-report.json`
              </span>
            </div>
          </section>
        </div>
      </section>

      <section class="content" id="app">
        <section class="panel">
          <div class="empty-state">
            上传 JSON 后，这里会显示总览、session 详情、bug 列表和 run 历史。
          </div>
        </section>
      </section>
    </main>

    <script>
      const COMPLETED_ISSUES_STORAGE_KEY = "codex-review-loop-completed-issues";

      const state = {
        file: null,
        report: null,
        selectedSessionIndex: 0,
        severityFilter: "all",
        completedIssueKeys: loadCompletedIssueKeys(),
      };

      const fileInput = document.getElementById("report-file");
      const renderButton = document.getElementById("render-button");
      const resetButton = document.getElementById("reset-button");
      const selectedFile = document.getElementById("selected-file");
      const statusText = document.getElementById("status-text");
      const app = document.getElementById("app");
      const dropzone = document.getElementById("dropzone");

      const severityOrder = ["critical", "high", "medium", "low"];
      const statusClassMap = {
        completed: "completed",
        failed: "failed",
      };

      fileInput.addEventListener("change", () => {
        state.file = fileInput.files?.[0] ?? null;
        updateSelectedFile();
      });

      renderButton.addEventListener("click", async () => {
        if (!state.file) {
          setStatus("请先选择一个 JSON 文件。", "error");
          return;
        }

        try {
          const content = await state.file.text();
          const data = JSON.parse(content);
          validateReport(data);
          state.report = data;
          state.selectedSessionIndex = getDefaultSessionIndex(data.sessions);
          state.severityFilter = "all";
          renderApp();
          setStatus("报告已成功解析并渲染。", "success");
        } catch (error) {
          state.report = null;
          renderEmpty(error?.message || "文件解析失败");
          setStatus(error?.message || "文件解析失败。", "error");
        }
      });

      resetButton.addEventListener("click", () => {
        state.file = null;
        state.report = null;
        state.selectedSessionIndex = 0;
        state.severityFilter = "all";
        fileInput.value = "";
        updateSelectedFile();
        renderEmpty();
        setStatus("已清空当前页面。");
      });

      dropzone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropzone.classList.add("dragover");
      });

      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("dragover");
      });

      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropzone.classList.remove("dragover");
        const [file] = event.dataTransfer?.files || [];
        if (!file) {
          return;
        }
        state.file = file;
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        fileInput.files = dataTransfer.files;
        updateSelectedFile();
      });

      function updateSelectedFile() {
        if (state.file) {
          selectedFile.textContent = `已选择: ${state.file.name}`;
          renderButton.disabled = false;
          return;
        }

        selectedFile.textContent = "当前未选择文件";
        renderButton.disabled = true;
      }

      function setStatus(message, tone) {
        statusText.textContent = message;
        statusText.className = "status-text";
        if (tone) {
          statusText.classList.add(tone);
        }
      }

      function loadCompletedIssueKeys() {
        try {
          const raw = localStorage.getItem(COMPLETED_ISSUES_STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return new Set(Array.isArray(parsed) ? parsed : []);
        } catch {
          return new Set();
        }
      }

      function persistCompletedIssueKeys() {
        localStorage.setItem(
          COMPLETED_ISSUES_STORAGE_KEY,
          JSON.stringify([...state.completedIssueKeys])
        );
      }

      function validateReport(data) {
        if (!data || typeof data !== "object") {
          throw new Error("JSON 根节点必须是对象。");
        }
        if (data.tool !== "codex-review-loop") {
          throw new Error("JSON 格式不匹配：缺少 tool = codex-review-loop。");
        }
        if (!Array.isArray(data.sessions)) {
          throw new Error("JSON 格式不匹配：缺少 sessions 数组。");
        }
      }

      function getDefaultSessionIndex(sessions) {
        const completedIndex = [...sessions]
          .map((session, index) => ({ session, index }))
          .reverse()
          .find(({ session }) => session.status === "completed");
        return completedIndex ? completedIndex.index : Math.max(0, sessions.length - 1);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatDateTime(value) {
        if (!value) {
          return "N/A";
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return String(value);
        }
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(date);
      }

      function formatNumber(value) {
        return new Intl.NumberFormat("zh-CN").format(Number(value) || 0);
      }

      function severityRank(severity) {
        const index = severityOrder.indexOf(String(severity).toLowerCase());
        return index === -1 ? 999 : index;
      }

      function getSeverityCounts(issues) {
        return issues.reduce(
          (acc, issue) => {
            const key = String(issue.severity || "unknown").toLowerCase();
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          },
          { critical: 0, high: 0, medium: 0, low: 0, unknown: 0 }
        );
      }

      function getOverallStats(report) {
        const sessions = report.sessions || [];
        return sessions.reduce(
          (acc, session) => {
            acc.sessionCount += 1;
            acc.runCount += Array.isArray(session.runs) ? session.runs.length : 0;
            acc.issueCount += Array.isArray(session.issues) ? session.issues.length : 0;
            acc.findingCount += Number(session.stats?.total_reported_findings || 0);
            acc.duplicateCount += Number(session.stats?.total_duplicate_findings_filtered || 0);
            return acc;
          },
          {
            sessionCount: 0,
            runCount: 0,
            issueCount: 0,
            findingCount: 0,
            duplicateCount: 0,
          }
        );
      }

      function renderApp() {
        if (!state.report) {
          renderEmpty();
          return;
        }

        const report = state.report;
        const sessions = report.sessions || [];
        const overall = getOverallStats(report);
        const selectedSession = sessions[state.selectedSessionIndex];

        if (!selectedSession) {
          renderEmpty("报告里没有可展示的 session。");
          return;
        }

        const issues = [...(selectedSession.issues || [])].sort((a, b) => {
          const severityDiff = severityRank(a.severity) - severityRank(b.severity);
          if (severityDiff !== 0) {
            return severityDiff;
          }
          return Number(a.start_line || 0) - Number(b.start_line || 0);
        });

        const filteredIssues =
          state.severityFilter === "all"
            ? issues
            : issues.filter(
                (issue) => String(issue.severity || "").toLowerCase() === state.severityFilter
              );

        const severityCounts = getSeverityCounts(issues);

        app.innerHTML = `
          ${renderOverview(report, overall)}
          ${renderSessionPanel(report, selectedSession, severityCounts, filteredIssues)}
        `;

        bindDynamicEvents();
      }

      function renderOverview(report, overall) {
        return `
          <section class="panel">
            <div class="panel-header">
              <h2 class="panel-title">报告总览</h2>
              <p class="panel-subtitle">
                当前版本 ${escapeHtml(report.version)}，共加载 ${formatNumber(
                  overall.sessionCount
                )} 个 session。
              </p>
            </div>
            <div class="stats-grid">
              <article class="stat-card">
                <div class="stat-label">Session 数</div>
                <div class="stat-value">${formatNumber(overall.sessionCount)}</div>
              </article>
              <article class="stat-card">
                <div class="stat-label">Run 总数</div>
                <div class="stat-value">${formatNumber(overall.runCount)}</div>
              </article>
              <article class="stat-card">
                <div class="stat-label">Unique Issues</div>
                <div class="stat-value">${formatNumber(overall.issueCount)}</div>
              </article>
              <article class="stat-card">
                <div class="stat-label">Reported Findings</div>
                <div class="stat-value">${formatNumber(overall.findingCount)}</div>
              </article>
              <article class="stat-card">
                <div class="stat-label">重复问题过滤数</div>
                <div class="stat-value">${formatNumber(overall.duplicateCount)}</div>
              </article>
            </div>
          </section>
        `;
      }

      function renderSessionPanel(report, selectedSession, severityCounts, filteredIssues) {
        const sessions = report.sessions || [];
        const sessionStatusClass =
          statusClassMap[String(selectedSession.status || "").toLowerCase()] || "warning";
        const errorBlock = selectedSession.error
          ? `<div class="error-box">${escapeHtml(selectedSession.error)}</div>`
          : "";

        return `
          <section class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Session 详情</h2>
              <p class="panel-subtitle">左侧切换 review session，右侧查看问题、统计和 run 历史。</p>
            </div>
            <div class="session-layout">
              <aside class="session-sidebar">
                <div class="session-list">
                  ${sessions
                    .map((session, index) => renderSessionCard(session, index))
                    .join("")}
                </div>
              </aside>
              <section class="session-main">
                <div class="session-meta">
                  <span class="pill ${sessionStatusClass}">状态: ${escapeHtml(
                    selectedSession.status || "unknown"
                  )}</span>
                  <span class="pill">停止原因: ${escapeHtml(
                    selectedSession.stop_reason || "N/A"
                  )}</span>
                  <span class="pill">Branch: ${escapeHtml(
                    selectedSession.current_branch || "N/A"
                  )}</span>
                </div>

                <div class="session-detail-grid">
                  <article class="detail-card">
                    <strong>Session ID</strong>
                    <span>${escapeHtml(selectedSession.session_id || "N/A")}</span>
                  </article>
                  <article class="detail-card">
                    <strong>时间范围</strong>
                    <span>${escapeHtml(formatDateTime(selectedSession.started_at))} 到 ${escapeHtml(
                      formatDateTime(selectedSession.finished_at)
                    )}</span>
                  </article>
                  <article class="detail-card">
                    <strong>Base / Merge Base</strong>
                    <span>${escapeHtml(selectedSession.base_ref || "N/A")} / ${escapeHtml(
                      selectedSession.merge_base || "N/A"
                    )}</span>
                  </article>
                  <article class="detail-card">
                    <strong>变更文件数</strong>
                    <span>${formatNumber(selectedSession.stats?.changed_file_count || 0)}</span>
                  </article>
                  <article class="detail-card">
                    <strong>Run 数 / Issue 数</strong>
                    <span>${formatNumber(selectedSession.runs?.length || 0)} / ${formatNumber(
                      selectedSession.issues?.length || 0
                    )}</span>
                  </article>
                  <article class="detail-card">
                    <strong>重复过滤统计</strong>
                    <span>${formatNumber(
                      selectedSession.stats?.total_duplicate_findings_filtered || 0
                    )} 条</span>
                  </article>
                </div>

                ${errorBlock}

                <div class="severity-row">
                  ${renderSeverityChip("all", selectedSession.issues?.length || 0, "全部")}
                  ${renderSeverityChip("critical", severityCounts.critical, "Critical")}
                  ${renderSeverityChip("high", severityCounts.high, "High")}
                  ${renderSeverityChip("medium", severityCounts.medium, "Medium")}
                  ${renderSeverityChip("low", severityCounts.low, "Low")}
                </div>

                <div class="issue-list">
                  ${filteredIssues.length ? filteredIssues.map(renderIssueCard).join("") : renderNoIssues()}
                </div>

                <div style="height: 24px"></div>

                <div class="run-list">
                  ${(selectedSession.runs || []).length
                    ? selectedSession.runs
                        .slice()
                        .sort((a, b) => Number(a.run_number || 0) - Number(b.run_number || 0))
                        .map(renderRunCard)
                        .join("")
                    : `
                        <article class="run-card">
                          <div class="run-top">
                            <h3>Run 历史</h3>
                          </div>
                          <p>这个 session 没有 run 记录。</p>
                        </article>
                      `}
                </div>
              </section>
            </div>
          </section>
        `;
      }

      function renderSessionCard(session, index) {
        const isActive = index === state.selectedSessionIndex;
        const issueCount = Array.isArray(session.issues) ? session.issues.length : 0;
        const runCount = Array.isArray(session.runs) ? session.runs.length : 0;
        return `
          <button
            type="button"
            class="session-card ${isActive ? "active" : ""}"
            data-session-index="${index}"
          >
            <h3>Session ${index + 1}</h3>
            <p>状态: ${escapeHtml(session.status || "unknown")}</p>
            <p>Runs: ${formatNumber(runCount)} | Issues: ${formatNumber(issueCount)}</p>
            <p>结束于: ${escapeHtml(formatDateTime(session.finished_at))}</p>
          </button>
        `;
      }

      function renderSeverityChip(key, count, label) {
        const active = state.severityFilter === key ? "active" : "";
        const severityClass = key === "all" ? "" : key;
        return `
          <button
            type="button"
            class="severity-chip ${severityClass} ${active}"
            data-severity="${key}"
          >
            ${escapeHtml(label)} · ${formatNumber(count)}
          </button>
        `;
      }

      function renderIssueCard(issue) {
        const severity = String(issue.severity || "unknown").toLowerCase();
        const lineText =
          issue.start_line && issue.end_line && issue.start_line !== issue.end_line
            ? `${issue.start_line}-${issue.end_line}`
            : issue.start_line || "N/A";
        const problemText = getIssueFieldText(issue);
        const issueKey = getIssueTodoKey(issue);
        const isCompleted = state.completedIssueKeys.has(issueKey);

        return `
          <article class="issue-card ${escapeHtml(severity)} ${isCompleted ? "completed" : ""}">
            <div class="issue-top">
              <div>
                <h3 class="issue-title">${escapeHtml(issue.title || "未命名问题")}</h3>
                <div class="issue-path">${escapeHtml(issue.path || "未知文件")} : ${escapeHtml(
                  lineText
                )}</div>
              </div>
              <div class="issue-badges">
                <span class="badge">${escapeHtml(severity.toUpperCase())}</span>
                <span class="badge">置信度 ${escapeHtml(
                  Number(issue.confidence || 0).toFixed(2)
                )}</span>
                <span class="badge">${escapeHtml(issue.category || "uncategorized")}</span>
                <span class="badge">Run ${escapeHtml(issue.first_seen_run || "N/A")} → ${escapeHtml(
                  issue.last_seen_run || "N/A"
                )}</span>
              </div>
            </div>

            <div class="issue-summary-list">
              ${renderIssueLine("问题", problemText, issueKey, isCompleted)}
            </div>
          </article>
        `;
      }

      function getIssueFieldText(issue) {
        const problem = String(issue?.problem || "").trim();
        if (!problem) {
          return "无";
        }
        return problem;
      }

      function getIssueTodoKey(issue) {
        return String(
          issue?.dedupe_key ||
            issue?.id ||
            `${issue?.path || "unknown"}:${issue?.start_line || 0}:${issue?.title || "untitled"}`
        );
      }

      function renderIssueLine(label, value, issueKey, isCompleted) {
        const text = value || "无";
        return `
          <div class="issue-line ${isCompleted ? "done" : ""}">
            <input
              class="issue-checkbox"
              type="checkbox"
              data-issue-key="${escapeHtml(issueKey)}"
              ${isCompleted ? "checked" : ""}
            />
            <span class="issue-line-label">${escapeHtml(label)}</span>
            <span class="issue-line-value" title="${escapeHtml(text)}">${escapeHtml(text)}</span>
            <span class="issue-line-status ${isCompleted ? "done" : ""}">
              ${isCompleted ? "已完成" : "待处理"}
            </span>
          </div>
        `;
      }

      function renderRunCard(run) {
        const scopeText = Array.isArray(run.review_scopes) ? run.review_scopes.join(", ") : "N/A";
        const newKeys = Array.isArray(run.new_issue_keys) ? run.new_issue_keys : [];
        return `
          <article class="run-card">
            <div class="run-top">
              <h3>Run ${escapeHtml(run.run_number || "N/A")}</h3>
              <div class="issue-badges">
                <span class="badge">新增 ${formatNumber(run.new_issue_count || 0)}</span>
                <span class="badge">唯一 ${formatNumber(run.unique_finding_count || 0)}</span>
                <span class="badge">上报 ${formatNumber(run.reported_finding_count || 0)}</span>
                <span class="badge">Scope: ${escapeHtml(scopeText)}</span>
              </div>
            </div>
            <p>${escapeHtml(run.summary || "无摘要")}</p>
            ${
              newKeys.length
                ? `
                  <ul>
                    ${newKeys.map((key) => `<li>${escapeHtml(key)}</li>`).join("")}
                  </ul>
                `
                : ""
            }
            ${
              run.raw_review
                ? `
                  <details>
                    <summary>展开原始 review 文本</summary>
                    <p>${escapeHtml(run.raw_review)}</p>
                  </details>
                `
                : ""
            }
          </article>
        `;
      }

      function renderNoIssues() {
        return `
          <article class="issue-card">
            <div class="empty-state" style="padding: 24px">
              当前筛选条件下没有 issue。
            </div>
          </article>
        `;
      }

      function renderEmpty(errorMessage) {
        app.innerHTML = `
          <section class="panel">
            <div class="empty-state">
              ${
                errorMessage
                  ? `<div class="error-box" style="display: inline-block; text-align: left">${escapeHtml(
                      errorMessage
                    )}</div>`
                  : "上传 JSON 后，这里会显示总览、session 详情、bug 列表和 run 历史。"
              }
            </div>
          </section>
        `;
      }

      function bindDynamicEvents() {
        app.querySelectorAll("[data-session-index]").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedSessionIndex = Number(button.dataset.sessionIndex || 0);
            state.severityFilter = "all";
            renderApp();
          });
        });

        app.querySelectorAll("[data-severity]").forEach((button) => {
          button.addEventListener("click", () => {
            state.severityFilter = button.dataset.severity || "all";
            renderApp();
          });
        });

        app.querySelectorAll("[data-issue-key]").forEach((input) => {
          input.addEventListener("change", () => {
            const issueKey = input.dataset.issueKey;
            if (!issueKey) {
              return;
            }

            if (input.checked) {
              state.completedIssueKeys.add(issueKey);
            } else {
              state.completedIssueKeys.delete(issueKey);
            }

            persistCompletedIssueKeys();
            renderApp();
          });
        });
      }
    </script>
  </body>
</html>
